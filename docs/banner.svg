<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">Hamsi · Karadeniz'de hamsi avı</title>
<desc id="d">Hamsi oyununun afişi, şarkı videosunun kapanış kartı düzeninde: lacivert zemin, kırmızı alt çizgili "Turkish is easy… at sea?" şeridi, krem rengi HAMSİ başlığı, altın sarısı "Karadeniz'de hamsi avı" alt başlığı ve OYNA düğmesi; sağda altın çerçeveli kartta sarı yağmurluklu balıkçı kız, mavi beyaz tekne, mantar halkası ve gümüş hamsi.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D283A"/><stop offset="1" stop-color="#0A2233"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="46%" r="50%"><stop offset="0" stop-color="#F5C330" stop-opacity=".16"/><stop offset="1" stop-color="#F5C330" stop-opacity="0"/></radialGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#142332"/><stop offset=".6" stop-color="#1E4266"/><stop offset="1" stop-color="#2C4D61"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#424F4C"/><stop offset="1" stop-color="#2A3F3C"/></linearGradient>
<radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E39F10" stop-opacity=".75"/><stop offset="1" stop-color="#E39F10" stop-opacity="0"/></radialGradient>
<clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
<clipPath id="card"><rect x="0" y="0" width="440" height="290" rx="22"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="400" fill="url(#bg)"/>
<ellipse cx="640" cy="190" rx="620" ry="230" fill="url(#glow)"/>

<!-- nokta sırası ve dalgalar: kapanış kartının alt bölümü -->
<g fill="#9B8834"><circle cx="78" cy="322" r="4" opacity=".35"/><circle cx="198" cy="334" r="4"/><circle cx="318" cy="322" r="4"/><circle cx="438" cy="334" r="4"/><circle cx="558" cy="322" r="4"/><circle cx="678" cy="334" r="4" opacity=".35"/></g>
<path fill="#1A445A" d="M0 350Q160 334 320 346T640 348T960 342T1280 350V400H0z"/>
<path fill="#123950" d="M0 372Q200 356 400 368T800 366T1280 372V400H0z"/>
<path fill="#0A2233" d="M0 392Q320 380 640 388T1280 390V400H0z"/>

<!-- şerit: koyu zemin, krem serif küçük büyük harf, kırmızı alt çizgi -->
<g transform="translate(378 44)">
<rect x="-158" y="0" width="316" height="34" fill="#1B1F25"/>
<rect x="-158" y="33" width="316" height="3" fill="#E82225"/>
<text x="0" y="23" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-weight="700" font-size="17" letter-spacing="1.6" fill="#F7F8F7">TURKISH IS EASY… AT SEA?</text>
</g>

<!-- başlık -->
<text x="378" y="184" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-weight="700" font-size="104" letter-spacing="3" fill="#0A1622" opacity=".6" transform="translate(0 5)">HAMSİ</text>
<text x="378" y="184" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-weight="700" font-size="104" letter-spacing="3" fill="#F8F7F1">HAMSİ</text>
<text x="378" y="228" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="26" letter-spacing=".6" fill="#F9C11E">Karadeniz'de hamsi avı</text>

<!-- OYNA düğmesi ve adres etiketi -->
<g transform="translate(236 252)">
<rect x="-106" y="0" width="212" height="50" rx="25" fill="#F5C330"/>
<path d="M-74 13L-52 25L-74 37z" fill="#0D283A"/>
<text x="20" y="35" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="27" fill="#0D283A">OYNA</text>
</g>
<g transform="translate(490 261)">
<rect x="-136" y="0" width="272" height="32" rx="5" fill="#0D1A23"/>
<text x="0" y="23" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="19" fill="#FBFCF8">furkiozknn.github.io/hamsi/</text>
</g>

<!-- sahne kartı: altın çerçeve, hafif eğik -->
<g transform="translate(770 40) rotate(-2 220 145)">
<rect x="-5" y="-5" width="450" height="300" rx="27" fill="#0A1622" opacity=".5" transform="translate(4 8)"/>
<rect x="-5" y="-5" width="450" height="300" rx="27" fill="#F5C330"/>
