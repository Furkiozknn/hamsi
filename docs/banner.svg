<ellipse cx="226" cy="228" rx="186" ry="30" fill="none" stroke="#6B5A47" stroke-width="2"/>
<ellipse cx="226" cy="228" rx="186" ry="30" fill="none" stroke="#9A7556" stroke-width="11" stroke-linecap="round" stroke-dasharray="15 21"/>
