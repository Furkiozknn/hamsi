<path fill="#3A2A22" d="M232 110q-8 24 0 40h44q8 -16 0 -40z"/>
<rect x="228" y="140" width="54" height="52" rx="16" fill="#DDB125"/>
<path stroke="#C69B1D" stroke-width="2" fill="none" d="M255 146v40"/>
