<path fill="#39444E" d="M40 84h24l6 86H34z"/><rect x="38" y="64" width="28" height="20" rx="3" fill="#2A323A"/><path fill="#2A323A" d="M36 64l16-14l16 14z"/><rect x="45" y="68" width="14" height="12" rx="2" fill="#F5C330"/>
<!-- liman evi ve lamba -->
<path fill="#2A2D33" d="M352 60l52-20l36 14v126h-88z"/>
<g fill="#1B1F25"><rect x="368" y="84" width="16" height="22"/><rect x="398" y="84" width="16" height="22"/></g>
<circle cx="360" cy="124" r="30" fill="url(#lamp)"/><circle cx="360" cy="124" r="5" fill="#F9C11E"/>
<!-- deniz -->
<rect y="170" width="440" height="120" fill="url(#sea)"/>
<g fill="none" stroke="#5B6E69" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M20 196h46"/><path d="M370 204h50"/><path d="M300 270h60"/><path d="M30 262h30"/></g>
