<circle cx="255" cy="124" r="23" fill="#F0C6A2"/>
<path fill="#3A2A22" d="M274 132q10 4 8 16q-2 10 -6 16q-6 -8 -5 -17q0 -8 3 -15z"/>
<circle cx="277" cy="166" r="4" fill="#DDB125"/>
<g fill="#1B1B1B"><circle cx="246" cy="126" r="3.4"/><circle cx="264" cy="126" r="3.4"/></g>
<g fill="#E58F86" opacity=".6"><circle cx="240" cy="134" r="4.5"/><circle cx="270" cy="134" r="4.5"/></g>
<path d="M250 136q5 5 10 0" fill="none" stroke="#7A3F36" stroke-width="2" stroke-linecap="round"/>
<path fill="#DDB125" d="M229 110q1 -34 26 -36q25 2 26 36z"/>
<ellipse cx="255" cy="110" rx="38" ry="10" fill="#C69B1D"/>
<path fill="#E9C544" opacity=".7" d="M238 100q2 -18 14 -22q-8 8 -8 22z"/>
<!-- gövde -->
<path fill="#C9CFCD" d="M78 180L356 170Q350 240 302 244H142Q92 240 78 180z"/>
<path fill="#3F6C79" d="M78 180L356 170L353 190L82 198z"/>
<path fill="#335B6C" d="M98 224L344 216Q334 242 302 244H142Q108 242 98 224z"/>
<g stroke="#AEB6B4" stroke-width="2" fill="none"><path d="M90 210L340 203"/></g>
<!-- hamsi -->
<ellipse cx="112" cy="272" rx="40" ry="7" fill="#2A3F3C"/>
<path fill="#8FA2B8" d="M88 270q-6 -44 26 -50q30 4 26 50z"/>
